name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  runtime-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the runtime zip
        run: python tools/make_zip.py
      - name: attach it to the release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/hypergamy-runtime.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
